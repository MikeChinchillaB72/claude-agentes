name: pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Las acciones se fijan por commit (SHA), no por etiqueta: una etiqueta se puede
# mover, un commit no. Versiones comprobadas el 2026-11-06 (docs/cambios_2026-11-06.md).
jobs:
  redes-y-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m redes
      - run: pip install -e ".[dev]"
      - run: pytest -q

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial: un secreto borrado sigue en commits viejos
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El repositorio es de una cuenta personal: gitleaks-action no pide licencia.
          # Sin comentarios en el PR: el token solo tiene permiso de lectura (mínimo
          # privilegio). Un hallazgo hace fallar el job, que es lo que importa.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1" # la misma que .pre-commit-config.yaml

  plugins:
    runs-on: ubuntu-latest
    env:
      # Versión fijada de Claude Code (publicada el 2026-11-06). Se sube a mano,
      # comprobando antes que `claude plugin validate` sigue pasando en local.
      CLAUDE_CODE_VERSION: "2.1.319"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      # El catálogo y cada plugin por separado: validar el catálogo no revisa
      # que el nombre de cada plugin.json coincida con su entrada (comprobado el 2026-11-07).
      - run: claude plugin validate .
      - run: |
          for plugin in plugins/*/; do
            claude plugin validate "$plugin"
          done
