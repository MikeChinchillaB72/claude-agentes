[project]
name = "agentes-base"
version = "0.1.0"
description = "Base para crear agentes con el Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.178",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["agentes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
